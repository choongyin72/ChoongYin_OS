# Account Mapping screen (OV_FIN_ACCOUNT_MAPPING) - Verify test data: the expected CURRENT
# state of the test record after TC02 Insert + TC03 Update, used by TC04 Find/Verify to
# round-trip check the form actually SHOWS what was saved. Kept as its OWN file (not reused
# from account_mapping_insert.properties/_update.properties) because it represents a MERGED
# state: Name/Description come from the update, every other field is unchanged since insert.
# Start Date is deliberately excluded - it lives only in objectdates, not updateAttributes
# (same convention as Bank/Customer/Cost Object Mapping).
Code=AUTOTEST_AM
Name=AUTOTEST Account Mapping UPDATED
Description=AUTOTEST Account Mapping Description UPDATED
Line Item Type=All Line Item Types
Financial Code=Journal Entry
Company Category=All
Status=Accrual
Debit / Credit=Credit
Debit PK=Debit General Ledger (40)
Credit PK=Credit General Ledger (50)
Account Category=Revenue
Financial Account=ACCRUAL CR Acct
