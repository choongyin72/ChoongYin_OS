# Object form's ECCell label dump (tmp/recon_product_description.robot, deleted before final
# commit): "Product Node Item Code" (screen-prefixed, NOT the generic "Code"), Name, Description
# (optional), Start Date, Product (reference dropdown), Node (reference dropdown), Financial Code
