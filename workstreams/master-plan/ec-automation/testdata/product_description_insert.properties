# placeholder would never match the resolved option text (Batch 2 VAT Code gotcha). Each literal
# is the dropdown's own real FIRST option, read back live via Fill OV Dropdown By Label
# __FIRST__ + Get OV Field Value By Label (tmp/recon_product_description.robot,
# "Recon Dropdown First Options" test case): Product=AS3_CrudeOil, Node=Apollo FPSO,
# Financial Code=Frame Agreement.
