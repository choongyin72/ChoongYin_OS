# Currency screen (OV_CURRENCY) - Insert test data. Column = value, one per line, read at
# Insert time. Field labels are the generic "Code"/"Name" (NOT screen-prefixed) - confirmed
# live 2026-08-23 via the New Object form recon (objectForm label dump: Code, Name, Start
# Date, End Date, Description, Comments, Active, "1/100 Units"), same convention as Bank/
# Object List/Cost Centre. Only Code/Name/Start Date are mandatory (MandatoryCellStyle on
# Code/Name inputs, confirmed live). Description/Comments/"1/100 Units" are optional and
# omitted (IUD-fill-only-needed-fields convention). The "Active" checkbox carries a
# MandatoryCellStyleWhite class but is NOT save-blocking - a live insert test with Active
# left unchecked (default) still saved successfully (OV_CURRENCY.ACTIVE_IND landed 'N'); a
# checkbox has no "empty" state so EC's mandatory-and-empty validation never fires on it.
# Genuinely omitted here (not merely deferred) for two independent reasons: (1) it's not
# required for Save to succeed (live-proven), and (2) T2's Fill OV Field By Label Any Kind
# (manage_object.resource) has no checkbox-kind branch - routing a checkbox through it would
# hit Fill EC Field -> Playwright Fill Text on a <input type=checkbox>, which errors.
