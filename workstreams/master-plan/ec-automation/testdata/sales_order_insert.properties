# Sales Order screen (OV_PRODUCT_SALES_ORDER) - Insert test data. Column = value, one per
# line, read at Insert time IN ORDER (PropertiesReader.read_properties preserves file order,
# and Insert Object From Properties fills fields in that same order). Neither mandatory
# dropdown here is a cascade (confirmed live 2026-08-23 - no "Dependent field" banner for
# either), so fill order does not matter for them, but Start Date is still listed first to
# match the form's own top-to-bottom layout.
# Mandatory fields confirmed live via a raw outerHTML/class dump (2026-08-23, same
# MandatoryCellStyle technique as VAT Code/Cost Object Mapping): Product Sales Order Code
# (screen-prefixed Code label - NOT generic "Code"), Name (input class), Start Date, and
# Company / Field (mandatory:true on the wrapping <span id="...:dd">, NOT the
# dd_input/dd_hinput <input> children). Description / Comments / Restrict Use (checkbox) are
# NOT mandatory and are omitted (IUD fills only needed fields).
# Both dropdown values are the REAL literal option text (NOT __FIRST__ - Batch 2 VAT Code
# gotcha: __FIRST__ never resolves to literal text for TC02's round-trip Verify Object Insert
# Exists comparison against this same file): Company="Acme Chemicals" (a clean option without
# the leading/internal double-spaces some Company options have, e.g. "  Company  BP" - same
# clean option already proven live on Cost Object Mapping, Batch 4), Field="Apollo" (a clean
# option, avoiding sibling options with leading spaces e.g. "  Esso Kizomba").
Product Sales Order Code=AUTOTEST_SO
Name=AUTOTEST Sales Order
Start Date=2003-01-01
Company=Acme Chemicals
Field=Apollo
