# Cost Object Mapping screen (OV_FIN_COST_OBJECT) - Insert test data. Column = value, one per
# line, read at Insert time IN ORDER (PropertiesReader.read_properties preserves file order,
# and Insert Object From Properties fills fields in that same order) - this order matters here
# because Cost Object is a CASCADE dropdown dependent on Start Date + Object Type both already
# being set (live-confirmed 2026-08-23: with Start Date empty, EC shows the banner "Dependent
# field 'Start Date' is empty" and the Cost Object dropdown returns zero options even after
# Object Type is picked; filling Start Date THEN Object Type THEN Cost Object works).
# Mandatory fields confirmed live via a raw outerHTML/class dump (2026-08-23, same
# MandatoryCellStyle technique as VAT Code/Customer): Code, Name (input class), and Object
# Type / Cost Object / Company / Distribution Object Type (mandatory:true on the wrapping
# <span id="...:dd">, NOT the dd_input/dd_hinput <input> children). Line Item Type / Node /
# Product / Profit Centre are NOT mandatory and are omitted (IUD fills only needed fields).
# All 4 dropdown values are the REAL literal option text (NOT __FIRST__ - Batch 2 VAT Code
# gotcha: __FIRST__ never resolves to literal text for TC02's round-trip Verify Object Insert
# Exists comparison against this same file): Object Type="Cost Center" (options: Cost Center/
# Revenue Order/WBS Element), Cost Object="AA" (only appears once Start Date+Object Type=Cost
# Center are both set - first cascade-populated option), Company="Acme Chemicals" (a clean
# option without the leading/internal double-spaces some Company options have, e.g.
# "  Company  BP"), Distribution Object Type="Country" (options: Country/Delivery Point/Field/
# Process Train/Well). Description is an optional field included so TC03's Update has a second
# field to change alongside Name (matches Bank's/Customer's own Name+Description update pair).
Code=AUTOTEST_CMAP
Name=AUTOTEST Cost Object Mapping
Start Date=2003-01-01
Description=AUTOTEST Cost Object Mapping Description
Object Type=Cost Center
Cost Object=AA
Company=Acme Chemicals
Distribution Object Type=Country
