# External Location (CO.0227) OV-GM navigator - INTENTIONALLY ZERO data lines.
# Unlike Area (mandatory Production Unit) or Well (mandatory 3-level P1 cascade), External
# Location's navigator fields are OPTIONAL FILTERS ONLY - the grid loads on GO alone, with
# nothing selected (see external_location_page.resource header + docs/ec_screen_registry.md,
# re-verified live 2026-08-26). This file exists purely so this screen can delegate to the same
# shared T2 "Apply Navigator From Properties" (resources/manage_object.resource) as every other
# OV-GM screen, for consistency - PropertiesReader.read_properties() returns an empty dict for a
# file with zero non-comment lines (confirmed by reading libraries/PropertiesReader.py), so the
# keyword's FOR loop runs zero iterations and falls straight through to "Apply Navigator" (GO),
# i.e. the exact same behaviour this screen already had before this change. Live-tested 2026-08-26.
