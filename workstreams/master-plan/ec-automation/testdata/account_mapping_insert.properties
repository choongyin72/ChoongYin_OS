# Account Mapping screen (OV_FIN_ACCOUNT_MAPPING) - Insert test data. Column = value, one per
# line, read at Insert time IN ORDER (PropertiesReader.read_properties preserves file order,
# and Insert Object From Properties fills fields in that same order) - this order matters here
# because Financial Account's option list is scoped by Account Category (cascade dependency,
# live-confirmed 2026-08-23, same pattern as Cost Object Mapping's Object Type->Cost Object) -
# Account Category is listed BEFORE Financial Account.
# Mandatory fields confirmed live via a raw outerHTML/class dump (2026-08-23, same
# MandatoryCellStyle technique as VAT Code/Customer/Cost Object Mapping - this screen puts the
# mandatory class on the input/dd-span itself, not a wrapping tableCell div): Code, Name (input
# class) and Line Item Type / Financial Code / Company Category / Status / Debit / Credit /
# Debit PK / Credit PK / Financial Account (mandatory:true + MandatoryCellStyle on the dd-span).
# Account Category is statically mandatory:false but functionally required for the Financial
# Account cascade to populate (documented above). Product / Alternative Code / Company are NOT
# mandatory and are omitted (IUD fills only needed fields). Description is optional, included
# so TC03's Update has a second field to change alongside Name (matches Bank's/Cost Object
# Mapping's own Name+Description update pair).
# All dropdown values are the REAL literal option text (NOT __FIRST__ - Batch 2 VAT Code
# gotcha), reusing the EXACT combination this screen's own prior Playwright IUD bundle already
# proved live-PASS 2026-06-12 (screens/.../Account_Mapping/account_mapping_sow.md) - the
# combination (not any single field) is this screen's real unique key; a fresh DB check
# 2026-08-23 confirmed no existing OV_FIN_ACCOUNT_MAPPING row uses this combination.
Code=AUTOTEST_AM
Name=AUTOTEST Account Mapping
Start Date=2003-01-01
Description=AUTOTEST Account Mapping Description
Line Item Type=All Line Item Types
Financial Code=Journal Entry
Company Category=All
Status=Accrual
Debit / Credit=Credit
Debit PK=Debit General Ledger (40)
Credit PK=Credit General Ledger (50)
Account Category=Revenue
Financial Account=ACCRUAL CR Acct
