# VAT Code screen (OV_VAT_CODE) - Insert test data. Column = value, one per line, read at
# Insert time. Field labels confirmed live 2026-08-23 via the New Object form's ECCell label
# dump (tmp/recon_vat_code_new_object_form.py, deleted before final commit). Start Date uses
# 2003-01-01 (EC_TEST_START_DATE_REFDD convention, environment.py) - this screen has TWO
# mandatory reference dropdowns (Country/VAT Type), and an earlier date can leave a
# version-filtered dropdown empty (registry: "EC Object Start Date = Version Filter").
# Three mandatory extras confirmed via a raw outerHTML dump (tmp/recon_vat_code_mandatory_check.py
# - {mandatory:true} MandatoryCellStyle on each): "VAT Code" (plain text, distinct from the
# object's own "Code" identifier), "Country" (reference dropdown, literal "Any" - confirmed live
# to be the first of 17 real catalogued options), "VAT Type" (reference dropdown, literal
# "Income" - confirmed live to be the first of 2 real options: Income/Cost), and
# "Rate (Decimal)" (numeric text). Literal values are used here (NOT __FIRST__) deliberately -
# TC02's Verify VAT Code Record Exists compares the LIVE SCREEN back against this exact file
# (T2's Verify Object Insert Exists), so a __FIRST__ placeholder would never match the resolved
# option text and always fail (live-confirmed 2026-08-23: TC02 failed with "Field 'Country'
# shows 'Any' in updateAttributes, expected '__FIRST__'" before this fix) - same reason
# Account's own insert file uses the literal "None", not __FIRST__, for its own dropdown.
Code=AUTOTEST_VAT
Name=AUTOTEST VAT Code
Start Date=2003-01-01
VAT Code=AT9
Country=Any
VAT Type=Income
Rate (Decimal)=0.1
