# Chemical Tank screen (OV_CHEM_TANK) - Insert test data. Column = value, one per line, read at
# Insert time. Chemical Tank Code/Chemical Tank Name are SCREEN-PREFIXED labels (same convention
# as Area's/Facility Class 1's own screen-prefixed labels - confirmed live via the existing
# chemical_tank_page.resource's "Fill OV Field By Label ... Chemical Tank Code/Chemical Tank
# Name"). Measure unit is an EXTRA mandatory dropdown over the plain OV (already proven by the
# existing driver, py/chemical_tank_iud.py) - kept as __FIRST__ (Fill OV Field By Label Any Kind
# supports this token for dropdowns, same as every other properties-driven insert in this repo
# that needs "any valid option").
#
# Op Production Unit is DELIBERATELY __FIRST__, NOT the navigator's own PU value (unlike Area's
# rule for its PU field) - live recon 2026-08-26 (tmp/recon_ct_insert_exact_properties_order.py)
# proved this screen's Op Production Unit list is FILTERED once Start Date + Measure unit are
# set, and the filtered list does NOT include "AS1 EC Exploration Norway" (the nav's own PU
# value) - only ['EC-UT-GENERIC Production Unit', 'FRMW PU', 'P1 Production Unit', 'P3 Production
# Unit', 'automation_ui_test']. Forcing the nav's PU value here times out (confirmed live, the
# exact TC02 failure this recon reproduced). The already-proven driver (py/chemical_tank_iud.py,
# verify_screen PASS 2026-07-30, still passing) already uses __FIRST__ for this field and the
# resulting row IS grid-visible under the nav scope - trusting that proven behavior rather than
# reinventing a rule from a different screen (Area) that doesn't hold here.
Chemical Tank Code=AUTOTEST_CT
Chemical Tank Name=Automation Test Chemical Tank
Start Date=2000-01-01
Measure unit=__FIRST__
Op Production Unit=__FIRST__
