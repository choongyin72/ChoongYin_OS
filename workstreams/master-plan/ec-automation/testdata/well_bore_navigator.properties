# Well Bore (CO.0054) OV-GM navigator - PER-FIELD groups nav:form:G:1..G:4:R:1:C:0 (NOT a
# same-row cascade, so the shared T2 "Apply Navigator From Properties" in
# resources/manage_object.resource does not cover this shape - see that keyword's own
# documented "KNOWN LIMITATION" for PER-FIELD groups). Filled instead by this screen's own
# bespoke T3 "Apply Well Bore Navigator From Properties" keyword
# (pageobjects/.../well_bore_page.resource), one line per group in file order: G:1, G:2, G:3,
# G:4. A 5th group G:5 ("Well") exists and is scan-flagged mandatory (CSS) but offers ZERO
# options under every scope tried - confirmed by the pre-existing driver py/well_bore_iud.py
# (recon 2026-07-31) and re-confirmed live 2026-08-27 - it is deliberately left EMPTY; GO
# succeeds and the grid loads on 4 levels.
# Values carried over VERBATIM from py/well_bore_iud.py's NAV tuple (the already-proven driver) -
# not invented: G:4 is a REAL well (P1 W008 OP), not the first-available option (which is
# 'P1 Graph 001', a graph object with no bores).
G:1=P1 Production Unit
G:2=P1 Area
G:3=P1 Facility 1
G:4=P1 W008 OP
